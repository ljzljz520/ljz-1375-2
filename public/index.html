<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茶马古道资料站</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 id="appTitle">茶马古道资料站</h1>
    <small id="subtitle"></small>
  </div>
  <div class="controls">
    <label class="fv"><span data-i18n="sourceVersion">来源版本</span>:
      <code id="sourceVersion">…</code></label>
    <span id="netBadge" class="badge online" data-i18n="online">已联网</span>
    <button id="langToggle" class="btn">EN</button>
    <button id="printBtn" class="btn" data-i18n="printNote">打印件说明</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="stations" data-i18n="nav.stations">驿站</button>
  <button data-view="map" data-i18n="nav.map">路线图</button>
  <button data-view="plan" data-i18n="nav.plan">规划/搜索</button>
  <button data-view="routes" data-i18n="nav.routes">已审路线</button>
  <button data-view="history" data-i18n="nav.history">历史叙事</button>
  <button data-view="catalog" data-i18n="nav.catalog">编号目录</button>
  <button data-view="admin" data-i18n="nav.admin">维护</button>
</nav>

<main id="view"></main>

<footer class="sitefoot">
  <p id="footSafety" class="safety"></p>
  <p class="print-only" id="printPendingNote"></p>
</footer>

<script src="/app.js"></script>
</body>
</html>
